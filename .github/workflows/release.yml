name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            experimental: false
          - os: windows-2022
            name: windows-x86_64
            experimental: true
          - os: macos-14
            name: macos-arm64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libsdl2-dev
      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 cmake ninja
      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sdl2:x64-windows
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"; fi
          cmake -S . -B build_release -DCMAKE_BUILD_TYPE=Release -DAZTEC_GEN_DIR= $EXTRA
      - name: Build
        run: cmake --build build_release --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build_release --build-config Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE README.md dist/
          find build_release -name 'aztec_engine' -o -name 'aztec_engine.exe' | head -1 | xargs -I{} cp {} dist/
          tar -czf quetzal-engine-${{ matrix.name }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: quetzal-engine-${{ matrix.name }}
          path: quetzal-engine-${{ matrix.name }}.tar.gz
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: quetzal-engine-${{ matrix.name }}.tar.gz
